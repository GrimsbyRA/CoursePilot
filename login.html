<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B1B33"><title>Sign in — Trainisty</title><style>:root{--n:#0B1B33;--l:#C4FF3D;--t:#14B8A6;--mut:#66758a;--line:#e1e7ef}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#142033;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 18px 50px #0b1b3312}.brand{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:850;color:var(--n);margin-bottom:25px}.mark{width:38px;height:38px;border-radius:11px;background:var(--l);display:grid;place-items:center}.brand b{color:#14B8A6}h1{margin:0 0 6px;font-size:27px;letter-spacing:-.7px}p{color:var(--mut);margin:0 0 20px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button{padding:12px 15px;border:0;border-radius:10px;font:inherit;font-weight:750;cursor:pointer}.primary{background:var(--l);color:var(--n)}.secondary{background:#edf2f7;color:var(--n)}.status{font-size:13px;padding:12px;border-radius:10px;background:#eff6ff;margin-top:15px;display:none;white-space:pre-wrap}.status.show{display:block}.small{font-size:12px;margin-top:20px}.hidden{display:none!important}</style></head><body><main class="card"><div class="brand"><span class="mark">T</span><span>traini<b>sty</b></span></div><h1>Welcome to Trainisty</h1><p>Sign in to securely access your training records from any device.</p><div id="setup" class="status show">Setup required: add your Supabase project URL and public anon/publishable key to <b>supabase-config.js</b>, then run the SQL migrations in the deployment instructions.</div><form id="authForm"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required maxlength="254"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></div><div class="field" id="providerField"><label for="provider">Training provider / business name (for new accounts)</label><input id="provider" maxlength="160" autocomplete="organization" placeholder="Your training business"></div><div class="actions"><button class="primary" id="signin" type="submit">Sign in</button><button class="secondary" id="signup" type="button">Create account</button></div></form><div id="status" class="status" role="status" aria-live="polite"></div><p class="small"><a href="index.html">← Back to Trainisty website</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const $=id=>document.getElementById(id);let client=null;function msg(s){$('status').textContent=s;$('status').classList.add('show')}function configured(){return window.supabase&&window.TRAINISTY_SUPABASE_URL&&window.TRAINISTY_SUPABASE_ANON_KEY&&!window.TRAINISTY_SUPABASE_URL.includes('YOUR_PROJECT')&&!window.TRAINISTY_SUPABASE_ANON_KEY.includes('YOUR_SUPABASE')}if(configured()){client=window.supabase.createClient(window.TRAINISTY_SUPABASE_URL,window.TRAINISTY_SUPABASE_ANON_KEY);$('setup').classList.add('hidden');client.auth.getSession().then(({data})=>{if(data.session)location.replace('app.html')})}else{$('authForm').classList.add('hidden')} $('authForm').addEventListener('submit',async e=>{e.preventDefault();if(!client)return;const email=$('email').value.trim(),password=$('password').value; $('signin').disabled=true;try{const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;if(data.session)location.href='app.html'}catch(err){msg(err.message||'Sign-in failed.')}finally{$('signin').disabled=false}});$('signup').addEventListener('click',async()=>{if(!client)return;const email=$('email').value.trim(),password=$('password').value,provider=$('provider').value.trim();if(!email||password.length<8){msg('Enter a valid email and a password of at least 8 characters.');return}if(!provider){msg('Enter your training provider/business name to create an account.');return}$('signup').disabled=true;try{const {data,error}=await client.auth.signUp({email,password,options:{data:{provider_name:provider},emailRedirectTo:location.origin+location.pathname.replace(/login\.html$/,'app.html')}});if(error)throw error;if(data.session){location.href='app.html'}else{msg('Account created. Check your email to confirm your address, then return here to sign in.')}}catch(err){msg(err.message||'Account creation failed.')}finally{$('signup').disabled=false}});</script></body></html>
